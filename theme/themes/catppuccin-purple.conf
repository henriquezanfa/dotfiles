# base16 palette (catppuccin-purple). Sourced by tmux, parsed by nvim.
# Activate with: theme/use <name>   (or copy this file to add a new theme)
# Each comment says what the slot is and exactly where this config uses it.
#
# --- Backgrounds and grays (00-07, dark -> light) ---

set -g @base00 "#101321"   # MAIN BACKGROUND. nvim editor bg; tmux pane bg, status bar bg, pane border bg
set -g @base01 "#1f1830"   # RAISED BG. nvim cursorline/sign column/statusline bg; tmux: TEXT color drawn on top of colored pills (session name, window number, clock); lualine: text on mode pill, inactive bg
set -g @base02 "#3b2f52"   # BOX BG. tmux: directory box, current window name box, inactive window tabs, message line; lualine: branch/diagnostics section; nvim: visual selection
set -g @base03 "#51436b"   # MUTED GRAY. nvim comments, line numbers, ignored text; tmux: inactive pane borders, copy-mode selection
set -g @base04 "#7a6a9a"   # DIM TEXT. tmux: inactive window titles; nvim: statusline text, secondary text
set -g @base05 "#cdd6f4"   # NORMAL TEXT. nvim default text; tmux status text (directory, window title); lualine text
set -g @base06 "#f5e0dc"   # BRIGHT TEXT. nvim only, a few UI elements; not used in tmux
set -g @base07 "#b4befe"   # BRIGHTEST TEXT. nvim only, rare; not used in tmux

# --- Accent colors (08-0F) ---

set -g @base08 "#f38ba8"   # RED. nvim errors, deleted diff lines, variables; lualine replace/command mode pill
set -g @base09 "#fab387"   # ORANGE. nvim numbers, booleans, constants; not used in tmux
set -g @base0A "#f9e2af"   # YELLOW. nvim types/classes, warnings, search highlight; not used in tmux
set -g @base0B "#a6e3a1"   # GREEN. nvim strings, added diff lines; lualine insert mode pill; not used in tmux
set -g @base0C "#94e2d5"   # AQUA. nvim regex, escape characters, special symbols; not used in tmux
set -g @base0D "#89b4fa"   # BLUE. nvim functions/methods; tmux: session name pill (left), clock pill (right); lualine normal mode pill
set -g @base0E "#cba6f7"   # PINK/PURPLE. nvim keywords (if, return, ...); tmux: active pane border, circles on the border, current window number; lualine visual mode pill
set -g @base0F "#f2cdcd"   # DARK ORANGE. nvim deprecated items, embedded-language tags; not used in tmux

# --- tmux-only extras ---

set -g @pane_active "#89b4fa"   # ACTIVE PANE. tmux: active pane border and the circles on it
