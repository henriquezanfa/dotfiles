# base16 palette (gruvbox-soft). Sourced by tmux, parsed by nvim.
# Activate with: theme/use <name>   (or copy this file to add a new theme)
# Each comment says what the slot is and exactly where this config uses it.
#
# --- Backgrounds and grays (00-07, dark -> light) ---

set -g @base00 "#1d2021"   # MAIN BACKGROUND. nvim editor bg; tmux pane bg, status bar bg, pane border bg
set -g @base01 "#3c3836"   # RAISED BG. nvim cursorline/sign column/statusline bg; tmux: TEXT color drawn on top of colored pills (session name, window number, clock); lualine: text on mode pill, inactive bg
set -g @base02 "#504945"   # BOX BG. tmux: directory box, current window name box, inactive window tabs, message line; lualine: branch/diagnostics section; nvim: visual selection
set -g @base03 "#665c54"   # MUTED GRAY. nvim comments, line numbers, ignored text; tmux: inactive pane borders, copy-mode selection
set -g @base04 "#bdae93"   # DIM TEXT. tmux: inactive window titles; nvim: statusline text, secondary text
set -g @base05 "#d5c4a1"   # NORMAL TEXT. nvim default text; tmux status text (directory, window title); lualine text
set -g @base06 "#ebdbb2"   # BRIGHT TEXT. nvim only, a few UI elements; not used in tmux
set -g @base07 "#fbf1c7"   # BRIGHTEST TEXT. nvim only, rare; not used in tmux

# --- Accent colors (08-0F) ---

set -g @base08 "#9180E4"   # RED. nvim errors, deleted diff lines, variables; lualine replace/command mode pill
set -g @base09 "#a76eba"   # DART PURPLE. nvim numbers, booleans, constants; not used in tmux
set -g @base0A "#e9c068"   # YELLOW. nvim types/classes, warnings, search highlight; not used in tmux
set -g @base0B "#b2c068"   # GREEN. nvim strings, added diff lines; lualine insert mode pill; not used in tmux
set -g @base0C "#8ec07c"   # AQUA. nvim regex, escape characters, special symbols; not used in tmux
set -g @base0D "#83a598"   # BLUE. nvim functions/methods; tmux: session name pill (left), clock pill (right); lualine normal mode pill
set -g @base0E "#d3869b"   # PINK/PURPLE. nvim keywords (if, return, ...); tmux: active pane border, circles on the border, current window number; lualine visual mode pill
set -g @base0F "#d65d0e"   # DARK ORANGE. nvim deprecated items, embedded-language tags; not used in tmux

# --- tmux-only extras ---

set -g @pane_active "#d3869b"   # ACTIVE PANE. tmux: active pane border and the circles on it
